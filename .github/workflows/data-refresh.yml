name: Daily Data Refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh surveillance data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jax[cpu] jaxlib
          pip install -e ".[dev]"

      - name: Fetch CDC NWSS data
        run: python -m mosaic_core.ingest.nwss
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

      - name: Fetch Nextstrain data
        run: python -m mosaic_core.ingest.nextstrain

      - name: Fetch ProMED + WHO DON
        run: python -m mosaic_core.ingest.promed

      - name: Fetch retrospective validation sources
        run: python scripts/fetch_historical.py --outbreak all
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

      - name: Fetch current public data cache
        run: python scripts/fetch_current_data.py
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

      - name: Run BOCPD change-point detection
        run: python -m mosaic_core.detect.bocpd

      - name: Run KL-divergence genomic anomaly scoring
        run: python -m mosaic_core.detect.kl_anomaly

      - name: Deploy to Vercel
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
