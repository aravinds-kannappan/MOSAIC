name: Daily Data Refresh

on:
  schedule:
    # Run at 06:00 UTC daily (after NWSS weekly update window)
    - cron: "0 6 * * *"
  workflow_dispatch:  # Allow manual trigger

jobs:
  refresh:
    name: Refresh surveillance data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install jax[cpu] jaxlib
          pip install -e ".[dev]"

      - name: Fetch CDC NWSS data
        run: python -m mosaic.ingest.nwss
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

      - name: Fetch Nextstrain data
        run: python -m mosaic.ingest.nextstrain

      - name: Fetch ProMED + WHO DON
        run: python -m mosaic.ingest.promed

      - name: Run BOCPD change-point detection
        run: python -m mosaic.detect.bocpd

      - name: Run KL-divergence genomic anomaly scoring
        run: python -m mosaic.detect.kl_anomaly

      - name: Deploy to Vercel (trigger revalidation)
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
