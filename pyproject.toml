[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mosaic-surveillance"
version = "0.1.0"
description = "Multi-Modal Open Surveillance with AI-Driven Calibrated Inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "MOSAIC Contributors" }
]
keywords = ["biosurveillance", "epidemiology", "bayesian", "pandemic-detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  # Data ingestion
  "requests>=2.31",
  "feedparser>=6.0",
  "sodapy>=2.2",
  "httpx>=0.27",

  # LLM extraction
  "openai>=1.30",
  "pydantic>=2.7",
  "outlines>=0.0.46",

  # Change-point detection
  "bocpdms>=1.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",

  # Fusion model
  "numpyro>=0.15",
  "jax>=0.4.26",
  "jaxlib>=0.4.26",
  "arviz>=0.18",

  # Calibration
  "scikit-learn>=1.4",

  # API
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",

  # Utilities
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "matplotlib>=3.8",
  "plotly>=5.21",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
mosaic-ingest = "mosaic_core.cli:ingest"
mosaic-detect = "mosaic_core.cli:detect"
mosaic-fuse = "mosaic_core.cli:fuse"
mosaic-serve = "mosaic_core.cli:serve"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
